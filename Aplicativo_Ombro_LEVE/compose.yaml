services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      DATABASE_URL: postgresql://ombro:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/ombro
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ombro
      POSTGRES_USER: ombro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - resultados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ombro -d ombro"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  resultados:
